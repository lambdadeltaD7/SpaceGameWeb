<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration</title>

    <script type="module" src="../js/registration.js" defer></script>
    <script src="../js/sweetalert2.js" defer></script>

    <link rel="stylesheet" href="css/sweetalert2.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/forms.css">

</head>

<body>

    <div class="forms-container">
        <form class="forms-form top-form bottom-form">
            <h1 class="forms-title">Register New Account</h1>

            <div class="form-group">
                <input id="username_input" class="form-input" placeholder="Username"></input>
            </div>

            <div class="form-group">
                <input id="email_input" class="form-input" placeholder="Email"></input>
            </div>

            <div class="form-group">
                <input id="password_input" class="form-input" type="password" placeholder="Password"></input>
            </div>

            <div class="form-actions">
                <button id="register_btn" type="button" class="btn">Register</button>
            </div>

            <p id="status_text" class="status-text"></p>
        </form>
    </div>

</body>

</html>
