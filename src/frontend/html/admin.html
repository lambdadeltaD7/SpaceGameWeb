<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin page</title>

    <script type="module" src="../js/admin.js" defer></script>
    <script src="../js/sweetalert2.js" defer></script>

    <link rel="stylesheet" href="css/sweetalert2.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/admin.css">

</head>

<body>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">Admin Dashboard</h1>
            <p>Monitor system activity and manage users</p>
        </div>

        <div class="list-container">
            <div class="admin-section top-section">
                <h2 class="section-title">Active Sessions</h2>
                <div id="sessions_list" class="admin-list">

                </div>
            </div>

            <div class="admin-section">
                <h2 class="section-title">Registered Users</h2>
                <div id="users_list" class="admin-list">

                </div>
            </div>

            <div class="admin-section bottom-section">
                <h2 class="section-title">Recent Transactions</h2>
                <div id="transactions_list" class="admin-list">

                </div>
            </div>
        </div>
    </div>

</body>
</html>
