server {
    listen 80;

    root /usr/share/nginx/static/html;

    location = /api/v1/docs {
        proxy_pass http://main_app:8080/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        sub_filter '/openapi.json' '/api/v1/openapi.json';
        sub_filter_once off;
    }

    location = /api/v1/openapi.json {
        proxy_pass http://main_app:8080/openapi.json;
        proxy_set_header Host $host;
    }

    location /api/v1/ {
        proxy_pass http://main_app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /css/ {
        alias /usr/share/nginx/static/css/;
    }

    location /js/ {
        alias /usr/share/nginx/static/js/;
    }

    location /img/ {
        alias /usr/share/nginx/static/img/;
    }

    location / {
        index index.html;
        try_files $uri $uri/ $uri.html =404;
    }
}
